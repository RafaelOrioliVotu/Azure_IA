<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azure Speech to Text</title>

  <!-- Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .speech-card {
      width: 100%;
      max-width: 760px;
      border: 0;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .10);
    }
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #adb5bd;
      margin-right: 9px;
      transition: background-color .2s ease, box-shadow .2s ease;
    }
    .status-dot.listening {
      background: #198754;
      box-shadow: 0 0 0 5px rgba(25, 135, 84, .15);
    }
    #transcript {
      min-height: 240px;
      resize: vertical;
      background: #fff;
    }
    .hint { font-size: .875rem; }
  </style>
</head>
<body>
  <main class="card speech-card">
    <div class="card-body p-4 p-md-5">
      <h1 class="text-center h2 mb-4">Azure Speech to Text</h1>

      <!-- Indicador visual e texto do estado atual -->
      <div class="d-flex align-items-center justify-content-center mb-4" aria-live="polite">
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
        <span id="statusText" class="fw-semibold text-secondary">Parado</span>
      </div>

      <label for="transcript" class="form-label fw-semibold">Texto reconhecido</label>
      <textarea id="transcript" class="form-control mb-3" placeholder="O texto reconhecido aparecerá aqui..." readonly></textarea>

      <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
        <button id="startBtn" class="btn btn-primary px-4" type="button">Iniciar</button>
        <button id="stopBtn" class="btn btn-outline-danger px-4" type="button" disabled>Parar</button>
      </div>

      <div id="message" class="small text-center mt-3 text-secondary" role="status"></div>
      <p class="hint text-muted mt-4 mb-0">
        Dica: use HTTPS ou localhost e permita o acesso ao microfone quando solicitado pelo navegador.
      </p>
    </div>
  </main>

  <!-- SDK oficial do Azure Speech (JavaScript para navegador) -->
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

  <script>
    // ============================================================
    // CONFIGURAÇÕES DO SERVIÇO AZURE — PREENCHA ANTES DE EXECUTAR
    // ============================================================
    const subscriptionKey = "INSIRA_SUA_CHAVE_AZURE_AQUI";
    const ServiceRegion = "INSIRA_SUA_REGIAO_AQUI"; // Ex.: brazilsouth

    // Elementos da interface
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const transcript = document.getElementById("transcript");
    const message = document.getElementById("message");

    // Estado/variáveis da sessão
    let recognizer = null;
    let textoFinal = "";   // Guarda somente segmentos finais confirmados
    let textoParcial = ""; // Prévia temporária; nunca é incorporada a textoFinal
    let isListening = false;

    // Atualiza indicador, rótulo e estado dos botões
    function setListeningState(listening) {
      isListening = listening;
      statusDot.classList.toggle("listening", listening);
      statusText.textContent = listening ? "Escutando..." : "Parado";
      statusText.classList.toggle("text-success", listening);
      statusText.classList.toggle("text-secondary", !listening);
      startBtn.disabled = listening;
      stopBtn.disabled = !listening;
    }

    // Renderiza o texto confirmado junto da prévia atual (sem salvá-la)
    function renderTranscript() {
      transcript.value = textoFinal + textoParcial;
      transcript.scrollTop = transcript.scrollHeight;
    }

    // Início do reconhecimento contínuo
    async function iniciarReconhecimento() {
      if (isListening) return;

      if (!subscriptionKey || subscriptionKey === "INSIRA_SUA_CHAVE_AZURE_AQUI" ||
          !ServiceRegion || ServiceRegion === "INSIRA_SUA_REGIAO_AQUI") {
        message.textContent = "Preencha subscriptionKey e ServiceRegion no código antes de iniciar.";
        message.className = "small text-center mt-3 text-danger";
        return;
      }

      // Limpa os resultados da sessão anterior
      textoFinal = "";
      textoParcial = "";
      renderTranscript();
      message.textContent = "";

      try {
        // Configurações do serviço: chave, região e idioma pt-BR
        const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(subscriptionKey, ServiceRegion);
        speechConfig.speechRecognitionLanguage = "pt-BR";

        // Usa o microfone padrão do navegador/dispositivo
        const audioConfig = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
        recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);

        // Evento recognizing: atualiza somente a prévia em tempo real
        recognizer.recognizing = (sender, event) => {
          textoParcial = event.result && event.result.text ? event.result.text : "";
          renderTranscript();
        };

        // Evento recognized: adiciona apenas o resultado final à variável acumulada
        recognizer.recognized = (sender, event) => {
          if (event.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
            const trecho = (event.result.text || "").trim();
            if (trecho) {
              // O resultado final é salvo uma única vez; a prévia é descartada.
              textoFinal += (textoFinal && !textoFinal.endsWith(" ") ? " " : "") + trecho;
            }
          } else if (event.result.reason === SpeechSDK.ResultReason.NoMatch) {
            // Sem correspondência: não adiciona texto.
          }

          textoParcial = "";
          renderTranscript();
        };

        // Eventos de erro/cancelamento do serviço
        recognizer.canceled = (sender, event) => {
          message.textContent = "Reconhecimento cancelado: " + (event.errorDetails || event.reason || "motivo não informado");
          message.className = "small text-center mt-3 text-danger";
          finalizarEstado();
        };

        recognizer.sessionStopped = () => {
          finalizarEstado();
        };

        // Controle de status: muda a interface assim que a sessão começa
        setListeningState(true);
        message.textContent = "Solicitando acesso ao microfone...";
        message.className = "small text-center mt-3 text-secondary";

        // API de reconhecimento contínuo do Azure Speech SDK
        recognizer.startContinuousRecognitionAsync(
          () => {
            message.textContent = "Reconhecimento iniciado. Fale perto do microfone.";
          },
          (error) => {
            message.textContent = "Falha ao iniciar: " + error;
            message.className = "small text-center mt-3 text-danger";
            finalizarEstado();
          }
        );
      } catch (error) {
        message.textContent = "Erro: " + error.message;
        message.className = "small text-center mt-3 text-danger";
        finalizarEstado();
      }
    }

    // Restaura o estado visual e libera recursos após a parada
    function finalizarEstado() {
      setListeningState(false);
      textoParcial = "";
      renderTranscript();
      if (recognizer) {
        recognizer.close();
        recognizer = null;
      }
    }

    // Parada do reconhecimento contínuo
    function pararReconhecimento() {
      if (!recognizer) {
        finalizarEstado();
        return;
      }

      stopBtn.disabled = true;
      message.textContent = "Parando reconhecimento...";
      recognizer.stopContinuousRecognitionAsync(
        () => {
          finalizarEstado();
          message.textContent = "Reconhecimento parado.";
          message.className = "small text-center mt-3 text-secondary";
        },
        (error) => {
          message.textContent = "Erro ao parar: " + error;
          message.className = "small text-center mt-3 text-danger";
          finalizarEstado();
        }
      );
    }

    startBtn.addEventListener("click", iniciarReconhecimento);
    stopBtn.addEventListener("click", pararReconhecimento);
  </script>
</body>
</html>
